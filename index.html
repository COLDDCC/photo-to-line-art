<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo to Line Art · 照片转排线画</title><meta name="description" content="免费将照片转换为排线艺术。支持四种线条方向、本地处理、参数调整和无水印 PNG 下载。"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><i>▧</i>排线画实验室</div><small>PHOTO TO LINE ART / 001</small></header><main><h1>用线条，重新画一张照片。</h1><p class="intro">从一张照片到一幅排线画。调整疏密，留下光影。</p><div class="layout"><section class="stage" id="drop"><div class="toolbar"><span id="imageName">内置示例 · 山间日落</span><button id="compare">查看原图</button></div><div class="paper"><canvas id="art"></canvas></div></section><aside class="panel"><label class="upload" for="file">＋ 上传你的照片</label><input type="file" accept="image/jpeg,image/png,image/webp" id="file" hidden><div class="section">01 / 线条方向</div><div class="styles" id="styles"><button data-style="diagonal" class="active">╱ 斜向排线</button><button data-style="cross">╳ 交叉排线</button><button data-style="horizontal">☰ 水平排线</button><button data-style="vertical">||| 垂直排线</button></div><div class="section">02 / 调整笔触</div><label class="control"><span>线条密度 <output id="densityOut"></output></span><input type="range" id="density" min="2" max="20" value="11"></label><label class="control"><span>线条粗细 <output id="widthOut"></output></span><input type="range" id="width" min="0.4" max="2.4" step="0.1" value="0.9"></label><label class="control"><span>明暗对比 <output id="contrastOut"></output></span><input type="range" id="contrast" min="0.5" max="2.2" step="0.1" value="1.2"></label><div class="colors"><label><input type="checkbox" id="colored"> 保留原图色彩</label><input type="color" id="ink" value="#35432c" aria-label="线条颜色"><input type="color" id="bg" value="#fffdf5" aria-label="背景颜色"></div><button class="download" id="download">↓ 下载高清 PNG</button><button class="reset" id="reset">恢复默认设置</button><div class="hint">图片只在你的浏览器中处理。<br>支持 JPG / PNG / WebP，最大 10 MB。</div></aside></div><div class="bottom"><span id="status" role="status">试试交叉排线，看看暗部如何变得更丰富。</span><span>本地处理 · 无需注册 · 无水印</span></div></main><script src="app.js" defer></script></body></html>
